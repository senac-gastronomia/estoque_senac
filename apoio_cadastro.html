<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Usuários</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">
        <header class="header top-header">
            <img src="img/icone.png" alt="Ícone" class="navbar-icon-img" onerror="this.src='img/lista.png'">
            <div>
                <h1>Cadastrar usuários</h1>
                <p>Cadastre docentes e auxiliares para acesso ao sistema.</p>
            </div>
        </header>

        <main class="form-card">
            <div class="form-title">
                <img src="img/adicionar-usuário.png" alt="Novo Usuário" class="section-icon" onerror="this.src='img/plus.png'">
                <span>Novo Usuário</span>
            </div>

            <form>
                <div class="user-type-group">
                    <label class="form-label" style="text-align: left; width: 100%; margin-bottom: 8px;">Tipo de usuário:</label>
                    <div class="user-type-options">
                        <button type="button" class="type-btn docente">
                            <img src="img/docente.png" alt="Docente" onerror="this.src='img/certo.png'">
                            <span>Docente</span>
                        </button>
                        <button type="button" class="type-btn auxiliar">
                            <img src="img/grupo-auxiliar.png" alt="Auxiliar" onerror="this.src='img/certo.png'">
                            <span>Auxiliar</span>
                        </button>
                    </div>
                </div>

                <div class="form-group" style="margin-top: 15px;">
                    <label for="nome" class="form-label" style="text-align: left; width: 100%;">Nome completo:</label>
                    <input type="text" id="nome" placeholder="Digite o nome completo" class="input-subgroup input" style="width: 100%; padding: 10px 14px; border: 1px solid #ccc; border-radius: 6px;" required>
                </div>

                <div class="form-group">
                    <label for="email" class="form-label" style="text-align: left; width: 100%;">Email:</label>
                    <input type="email" id="email" placeholder="Digite o email" style="width: 100%; padding: 10px 14px; border: 1px solid #ccc; border-radius: 6px;" required>
                </div>

                <div class="form-group">
                    <label for="senha" class="form-label" style="text-align: left; width: 100%;">Senha:</label>
                    <input type="password" id="senha" placeholder="Digite uma senha" style="width: 100%; padding: 10px 14px; border: 1px solid #ccc; border-radius: 6px;" required>
                </div>

                <div class="form-group">
                    <label for="confirmar-senha" class="form-label" style="text-align: left; width: 100%;">Confirmar Senha:</label>
                    <input type="password" id="confirmar-senha" placeholder="Confirme a senha" style="width: 100%; padding: 10px 14px; border: 1px solid #ccc; border-radius: 6px;" required>
                </div>

                <div class="alert-box" style="background-color: #006ec7; color: #fff; border-radius: 6px; padding: 12px 16px; display: flex; align-items: center; gap: 12px; margin: 25px 0;">
                    <div class="alert-icon" style="background-color: #fff; color: #006ec7; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; flex-shrink: 0;">i</div>
                    <div class="alert-text">
                        <strong style="display: block; font-size: 14px;">ATENÇÃO!</strong>
                        <p style="font-size: 12px; margin: 0; opacity: 0.9;">Verifique se todas as informações estão corretas antes de fazer o cadastro</p>
                    </div>
                </div>

                <div class="form-actions" style="display: flex; justify-content: flex-end; gap: 12px;">
                    <button type="reset" class="btn-clear" style="background-color: #000; color: #fff; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer;">Limpar Campos</button>
                    <button type="submit" class="btn-submit" style="background-color: #ff6600; color: #fff; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer;">Cadastrar Usuário</button>
                </div>
            </form>
        </main>
    </div>

</body>
</html>
