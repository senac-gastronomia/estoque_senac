<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css" />
    <title>Sidebar Auxiliar</title>
</head>

<body>

    <aside class="sidebar">
        <header class="sidebar-header">
            <img class="logo-img" src="/img/logo-SENAC.png" alt="Logo" />
        </header>


        <nav>
            <button>
                <span>
                    <img src="/img/icons8-home-50.png" alt="Home Icon" />
                    <span> Home </span>
                </span>
            </button>

            <button>
                <span>
                    <img src="/img/inbox.png" alt="Entrada Icon" />
                    <span> Entrada de Produtos </span>
                </span>
            </button>

            <button>
                <span>
                    <img src="/img/inbox.exit.png" alt="Saida Icon" />
                    <span> Saída de Produtos </span>
                </span>
            </button>

            <button>
                <span>
                    <img src="/img/icons8-clipboard-50.png" alt="Inventario Icon" />
                    <span> Inventario </span>
                </span>
            </button>

            <button>
                <span>
                    <img src="/img/icons8-shopping-cart-50.png" alt="Soli Icon" />
                    <span> Solicitação da Cozinha </span>
                </span>
            </button>

            <button>
                <span>
                    <img src="/img/icons8-graph-axes-24.png" alt="Relatório Icon" />
                    <span> Relatório </span>
                </span>
            </button>
        </nav>
    </aside>
</body>

</html>
