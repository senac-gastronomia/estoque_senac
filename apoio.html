<!DOCTYPE html>
<html lang="pt">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Apoio - Controle de Estoque</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div class="container">
    
    <div class="apoio-welcome-banner">
      <span class="apoio-emoji">👋</span>
      <div>
        <h2>Olá, Beltrano!</h2>
        <p>Veja o resumo da cozinha Senac</p>
      </div>
    </div>

    <div class="apoio-main-layout">
      
      <div class="apoio-col-left">
        <div class="card card-orange">
          <div class="card-icon"><img src="img/caixa.png" alt="Caixa"></div>
          <div class="card-content">
            <span class="card-title">Produtos em estoque</span>
            <h2 class="card-value">120 <span>itens</span></h2>
            <span class="card-desc">total de produtos disponíveis</span>
          </div>
        </div>

        <div class="card card-blue">
          <div class="card-icon"><img src="img/icone.png" alt="Usuários"></div>
          <div class="card-content">
            <span class="card-title">Usuários Cadastrados</span>
            <h2 class="card-value">22 <span>usuários</span></h2>
          </div>
        </div>

        <div class="summary-box">
          <div class="summary-title">
            <img src="img/lista.png" alt="Resumo">
            <h3>Resumo do mês</h3>
          </div>
          <div class="summary-item">
            <span><img src="img/lista.png" alt="Ícone" style="width: 14px; vertical-align: middle; margin-right: 5px;"> Solicitações realizadas</span>
            <strong>12</strong>
          </div>
          <div class="summary-item">
            <span><img src="img/certo.png" alt="Ícone" style="width: 14px; vertical-align: middle; margin-right: 5px;"> Aprovadas</span>
            <strong style="color: #28a745;">7</strong>
          </div>
          <div class="summary-item">
            <span><img src="img/clock.png" alt="Ícone" style="width: 14px; vertical-align: middle; margin-right: 5px;"> Pendentes</span>
            <strong style="color: #ffc107;">5</strong>
          </div>
        </div>
      </div>

      <div class="apoio-col-right">
        <section class="quick-actions" style="margin-top: 0;">
          <h3>Ações rápidas</h3>
          <div class="actions-grid">
            <div class="action-card orange-bg">
              <img src="img/plus.png" alt="Adicionar">
              <div>
                <strong>Pedidos</strong>
                <p>Verificar pedidos</p>
              </div>
            </div>
            <div class="action-card blue-bg">
              <img src="img/lista.png" alt="Lista">
              <div>
                <strong>Usuários</strong>
                <p>Cadastrar ou excluir usuários</p>
              </div>
            </div>
          </div>
        </section>

        <!-- Onde o gráfico gerado por JS vai entrar automaticamente -->
        <div id="grafico-container" style="margin-top: 0;"></div>
      </div>

    </div>
  </div>

  <script src="js/navbar.js"></script>
  <script src="js/grafico.js"></script>
</body>

</html>
